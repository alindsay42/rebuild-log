<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rebuild Log">
<title>Rebuild Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d5cc0'/%3E%3Crect x='8' y='22' width='8' height='20' rx='2' fill='white'/%3E%3Crect x='48' y='22' width='8' height='20' rx='2' fill='white'/%3E%3Crect x='16' y='28' width='32' height='8' fill='white'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">

<script>try{var t=(JSON.parse(localStorage.getItem("rebuild-log-v1"))||{}).settings;t=t&&t.theme;if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: tablet-first logbook. Sticky top bar with tabs, one column of cards, big touch targets, fixed rest timer at the bottom. */
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface-2:#f3f5f7; --ink:#15191e; --muted:#59636e; --line:#d3d9df;
  --accent:#1d5cc0; --accent-soft:#e3ecfa; --on-accent:#ffffff;
  --green:#1d7f47; --green-soft:#e1f2e8; --amber:#a76a10; --amber-soft:#f8ecd6; --red:#bb3a26; --red-soft:#f8e3df;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1e23; --surface-2:#22272d; --ink:#e7eaed; --muted:#9aa4ae; --line:#2e353d;
  --accent:#5b94ee; --accent-soft:#1d2b40; --on-accent:#0d1520;
  --green:#45b973; --green-soft:#17301f; --amber:#e3a641; --amber-soft:#35291a; --red:#ea6a55; --red-soft:#3a1f1b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1e23; --surface-2:#22272d; --ink:#e7eaed; --muted:#9aa4ae; --line:#2e353d;
  --accent:#5b94ee; --accent-soft:#1d2b40; --on-accent:#0d1520;
  --green:#45b973; --green-soft:#17301f; --amber:#e3a641; --amber-soft:#35291a; --red:#ea6a55; --red-soft:#3a1f1b;
  color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:8px;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs .live{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-left:6px;vertical-align:middle}
main{padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-size:19px;letter-spacing:.02em;margin:0;line-height:1.15}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.blue{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:currentColor}
/* traffic light */
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.light{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.light b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.light > span{font-size:13px;color:var(--muted);line-height:1.3}
.light .walk{font-size:14px;font-weight:600;color:var(--ink);margin-top:4px}
.light.green b{color:var(--green)} .light.amber b{color:var(--amber)} .light.red b{color:var(--red)}
.light[aria-pressed="true"].green{border-color:var(--green);background:var(--green-soft)}
.light[aria-pressed="true"].amber{border-color:var(--amber);background:var(--amber-soft)}
.light[aria-pressed="true"].red{border-color:var(--red);background:var(--red-soft)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:15px}
.banner.amber{background:var(--amber-soft);color:var(--ink);border-left:4px solid var(--amber)}
.banner.red{background:var(--red-soft);color:var(--ink);border-left:4px solid var(--red)}
.banner.blue{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
/* plan list */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .tgt{font-family:var(--display);font-size:18px;text-align:right}
.plan .why{grid-column:1/-1;font-size:13px;color:var(--muted)}
.plan li.off{opacity:.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* session */
.card.ss{border-left:4px solid var(--accent)}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ex-tgt{font-family:var(--display);font-size:20px;white-space:nowrap}
.hint{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.hint.up{background:var(--green-soft)} .hint.down{background:var(--amber-soft)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 64px;gap:8px;align-items:center;padding:6px;border-radius:8px;background:var(--surface-2)}
.set.done{background:var(--green-soft)}
.set .n{font-family:var(--display);font-size:20px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;text-align:center;min-height:50px}
.tick{height:56px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;color:var(--muted)}
.set.done .tick{background:var(--green);border-color:var(--green);color:#fff}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;min-height:80px;resize:vertical}
input[type=date],input[type=number].plain,select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;min-height:46px}
/* routine */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:12px;align-items:center;padding:10px;border-radius:8px;background:var(--surface-2);border:0;text-align:left;width:100%}
.check .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;background:var(--surface)}
.check[aria-pressed="true"] .box{background:var(--green);border-color:var(--green);color:#fff}
/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.rest .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.rest .t{font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.rest button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:8px 14px;font-weight:600;min-height:44px}
.rest.over{background:var(--green);color:#fff}
/* progress */
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);position:relative;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.day.green{background:var(--green-soft);border-color:var(--green)} .day.amber{background:var(--amber-soft);border-color:var(--amber)} .day.red{background:var(--red-soft);border-color:var(--red)}
.day.trained::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);top:4px;right:4px}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.strip.cal{grid-template-columns:repeat(7,minmax(0,1fr))}
.strip.cal .day{aspect-ratio:auto;height:52px}
.strip .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em}
button.day{font:inherit;cursor:pointer;padding:0}
button.day:disabled{opacity:.35;cursor:default}
.day.sel{outline:3px solid var(--accent);outline-offset:1px}
.dayfacts{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end}
.dayfacts > div{display:flex;flex-direction:column;gap:6px}
.log{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.log.editing{background:var(--surface-2);border:1px solid var(--accent);border-radius:var(--r);padding:12px}
.log.editing .set{background:var(--surface)}
.log.editing .set.done{background:var(--green-soft)}
.loglist{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px}
.loglist li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.loglist li.skipped{color:var(--muted)}
.edex{display:flex;flex-direction:column;gap:8px}
.day.future{background:transparent;border-style:dashed;color:var(--muted)}
.day.planned::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;border:2px solid var(--accent);top:3px;right:3px;box-sizing:border-box}
.ring{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);box-sizing:border-box}
.plan-day{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.wform{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.wform .field{width:150px}
.wform .field input{font-size:20px;min-height:46px}
.wform .check{width:auto}
.swatch{display:inline-block;width:14px;height:10px;background:var(--green-soft);border:1px solid var(--green);vertical-align:middle}
.stat span{display:block}
.addhere{display:flex;justify-content:center;margin-block:-10px}
.addhere .btn{min-height:34px;font-size:13px;color:var(--muted);border:1px dashed var(--line);background:transparent}
.ex-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.card.removed .rm{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.seg.small button{min-height:36px;padding:4px 10px;font-size:13px}
.picker{position:fixed;inset:0;z-index:30;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.picker .sheet{background:var(--surface);width:min(760px,100%);max-height:100%;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pick-list{overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.pgroup{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:12px;min-height:52px;width:100%}
.pick:disabled{opacity:.5;cursor:default}
.pick .confirm{flex-basis:100%;font-size:13px;font-weight:600;color:var(--amber)}
#pick-q{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.hist{display:flex;flex-direction:column;gap:0}
.hist details{border-top:1px solid var(--line);padding:10px 0}
.hist summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
@media (max-width:560px){
  .lights{grid-template-columns:1fr}
  .light{min-height:auto}
  .strip{grid-template-columns:repeat(7,minmax(0,1fr))}
  .set{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion:no-preference){.set,.light,.check .box{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Rebuild Log</b><span id="sub" class="num">Back recovery programme</span></div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="today" aria-current="page">Today</button>
      <button data-tab="session" id="tab-session" hidden>Session<span class="live"></span></button>
      <button data-tab="progress">Progress</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading your log…</div></main>
<div class="rest" id="rest" hidden>
  <div class="wrap">
    <span class="eyebrow" style="color:inherit">Rest</span>
    <span class="t" id="rest-t">0:00</span>
    <span id="rest-label" class="small" style="flex:1;min-width:120px"></span>
    <button id="rest-add">+30s</button>
    <button id="rest-skip">Done</button>
  </div>
</div>

<script>
/* ---------- Programme ---------- */
// mode: "load" (kg + reps), "reps" (reps only, optional kg), "time" (seconds), "dist" (metres + kg)
const EX = {
  ssb:{name:"SSB squat, heels raised",mode:"load",unit:"kg",inc:5,rest:150,note:"Heels on 5–10kg plates. As deep as you can without butt wink. Safety arms set.",amber:{to:"goblet"}},
  dbpress:{name:"Seated DB shoulder press",mode:"load",unit:"kg each",inc:2.5,rest:120,note:"Bench upright, back on the pad, no arching off it. Superset with pull-ups in Session A."},
  csrow:{name:"Chest-supported DB row",mode:"load",unit:"kg each",inc:2.5,rest:90,note:"ABX on incline, straight after the bench. Feet planted, chest stays on the pad, squeeze at the top."},
  hyper:{name:"Back hyperextension",mode:"load",unit:"kg",inc:2.5,rest:90,note:"Straight legs. Stop at a straight line, not past it. 2-second hold at the top."},
  legcurl:{name:"Leg curl (ABX)",mode:"load",unit:"kg",inc:2.5,rest:60,note:"Straight after leg extension, same machine setup."},
  pallof:{name:"Pallof press",mode:"reps",unit:"kg",each:"each side",rest:45,note:"Cable at chest height. 3-second hold, arms out. Resist the twist."},
  splank:{name:"Side plank",mode:"time",each:"each side",rest:45,note:"Knees, then feet when easy."},
  carry:{name:"Farmer's carry",mode:"dist",unit:"kg each",inc:2.5,rest:90,note:"Green days only. Tall, slow steps.",amber:"skip"},
  goblet:{name:"Goblet squat to box",mode:"load",unit:"kg DB",inc:2.5,rest:120,note:"3 seconds down. Front-loaded, easy on the spine."},
  bench:{name:"Flat barbell bench",mode:"load",unit:"kg",inc:2.5,rest:150,note:"Little or no arch. Feet flat or up on the bench. Safeties set."},
  pulldown:{name:"Seated pulldown / assisted pull-up",mode:"load",unit:"kg",inc:2.5,rest:90,note:"Sit on the bench under the pulley. Not kneeling."},
  legext:{name:"Leg extension (ABX)",mode:"load",unit:"kg",inc:2.5,rest:30,note:"Superset with leg curl: extension, then curl, then rest."},
  calfseat:{name:"Seated DB calf raise",mode:"load",unit:"kg",inc:2.5,rest:60,note:"S1 drives the calf. Note any left–right difference."},
  ezcurl:{name:"EZ curl (ABX attachment)",mode:"load",unit:"kg",inc:2.5,rest:60,note:"Superset with pushdowns. Stop if the right elbow or bicep complains."},
  pushdown:{name:"Cable triceps pushdown",mode:"load",unit:"kg",inc:2.5,rest:60},
  deadbug:{name:"Dead bug",mode:"reps",each:"each side",rest:45,note:"Slow. Low back stays flat on the floor."},
  dbrdl:{name:"DB Romanian deadlift",mode:"load",unit:"kg each",inc:2.5,rest:120,note:"Lower to just below the knee. Only if the last two weeks' 48-hour checks were clean.",amber:"skip"},
  hatfield:{name:"Hatfield squat (SSB, hands on safeties)",mode:"load",unit:"kg",inc:5,rest:150,amber:{to:"goblet"}},
  rdl:{name:"Romanian deadlift",mode:"load",unit:"kg",inc:5,rest:150,note:"DBs until 30kg each, then barbell from 60kg. Just below the knee.",amber:"skip"},
  calfstand:{name:"Standing calf raise",mode:"load",unit:"kg",inc:2.5,rest:60,note:"Stop short of full pointed toes if the left ankle pops."},
  suitcase:{name:"Suitcase carry",mode:"dist",unit:"kg",inc:2.5,rest:60,each:"each side",note:"Stand tall, don't lean away.",amber:"skip"},
  pullup:{name:"Pull-ups",mode:"load",unit:"kg added",inc:2.5,rest:120,note:"Superset with the shoulder press. Ribs down, core tight, dead stop at the bottom, no kipping. Band-assisted if needed."},
  dbcurl:{name:"DB curl",mode:"load",unit:"kg each",inc:2.5,rest:30,note:"Superset with pushdowns. Stop if the right elbow or bicep complains."},
  latraise:{name:"DB lateral raise",mode:"load",unit:"kg each",inc:1,rest:60},
  skull:{name:"EZ skull crusher",mode:"load",unit:"kg",inc:2.5,rest:60},
  trapbar:{name:"Trap bar deadlift, high handles",mode:"load",unit:"kg",inc:5,rest:180,note:"RPE 7. No singles. Raise the bar if the bottom rounds.",amber:"skip"},

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);

/* ---------- Store: shared db when available, this device otherwise ---------- */
const state = { sessions:[], days:{}, weights:{}, settings:{phase:1,startDate:"2026-11-02"}, loaded:false, mode:"local", tab:"today", pick:null, optional:{}, progEx:null, readOnly:false };
const LS = "rebuild-log-v1";
let db = null;
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } }
function lsSave(){ try { const sessions = {}; state.sessions.forEach(s=>sessions[s.id]=s); localStorage.setItem(LS, JSON.stringify({sessions, days:state.days, weights:state.weights, settings:state.settings})); } catch {} }
const queues = {};
function write(path, data){
  if (state.mode !== "db"){ lsSave(); return; }
  if (state.readOnly) return;
  const q = queues[path] ||= {busy:false,next:null};
  q.next = JSON.parse(JSON.stringify(data));
  if (!q.busy) pump(path);
}
async function pump(path){
  const q = queues[path]; q.busy = true;
  while (q.next){
    const d = q.next; q.next = null;
    try { await db.doc(path).set(d); }
    catch(e){
      if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try { await db.doc(path).set(d); continue; } catch{} }
      if (e && e.code === "invalid_argument"){ state.readOnly = true; toast("This view can't save changes."); }
      else if (e && e.code === "quota_exceeded"){ toast("Storage is full. Delete some old sessions in Progress."); }
      else toast("Couldn't save just now. Your entry is still on screen.");
    }
  }
  q.busy = false;
}
async function removeSession(id){

  state.sessions = state.sessions.filter(s=>s.id!==id);
  if (state.mode === "db"){ try { await db.doc("sessions/"+id).delete(); } catch { toast("Couldn't delete that session."); } } else lsSave();

}
function saveSession(s){ const i = state.sessions.findIndex(x=>x.id===s.id); if (i<0) state.sessions.unshift(s); else state.sessions[i]=s; write("sessions/"+s.id, s); }
let sessTimer = null;
function saveSessionSoon(s){ clearTimeout(sessTimer); sessTimer = setTimeout(()=>saveSession(s), 700); }
function applyTheme(){ const t = state.settings.theme; const r = document.documentElement; if (t==="dark"||t==="light") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme"); }
function day(d){ return state.days[d] || {}; }
function saveDay(d, patch){ state.days[d] = {...day(d), ...patch, date:d}; write("days/"+d, state.days[d]); }

async function boot(){
  // Local copy first so the page works anywhere
  const local = lsLoad();
  if (local.sessions) state.sessions = Object.values(local.sessions).sort((a,b)=>b.startedAt-a.startedAt);
  if (local.days) state.days = local.days;
  if (local.weights) state.weights = local.weights;
  if (local.settings) state.settings = {...state.settings, ...local.settings};
  state.loaded = true; applyTheme(); render();
  let got = null;
  try { got = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { got = null; }
  if (!got) return;
  db = got; state.mode = "db";
  let first = {s:false,d:false,c:false};
  const settle = () => { if (first.s && first.d && first.c) render(); };
  db.collection("sessions").orderBy("startedAt","desc").limit(500).onSnapshot(snap => {
    const active = currentSession();
    state.sessions = snap.docs.map(d=>({...d.data(), id:d.id}));
    // keep the live in-progress copy from this screen, which may be ahead of the store
    if (active){ const i = state.sessions.findIndex(x=>x.id===active.id); if (i>=0) state.sessions[i] = active; else if (active.status==="active") state.sessions.unshift(active); }
    first.s = true; if (state.tab !== "session") settle(); else updateTabs();
  }, onDbError);

  }, onDbError);

function onDbError(e){ if (e && e.code === "revoked"){ state.readOnly = true; } else toast("Lost connection to your log. Reload to reconnect."); }

/* ---------- Programme logic ---------- */
function weekNo(){ const s = new Date(state.settings.startDate+"T00:00:00"); const n = Math.floor((new Date(todayIso()+"T00:00:00") - s)/(7*DAY)) + 1; return n; }
function doneSessions(){ return state.sessions.filter(s=>s.status==="done"); }
function currentSession(){ return state.sessions.find(s=>s.status==="active") || null; }
function nextKey(){
  const P = PHASES[state.settings.phase];
  const last = doneSessions().filter(s=>s.phase===state.settings.phase).sort((a,b)=>b.startedAt-a.startedAt)[0];
  if (!last) return P.order[0];
  const i = P.order.indexOf(last.key);
  return P.order[(i+1) % P.order.length];
}
function lastFor(exId){
  for (const s of doneSessions().sort((a,b)=>b.startedAt-a.startedAt)){
    const e = (s.exercises||[]).find(x=>x.id===exId && !x.removed && (x.sets||[]).some(st=>st.done));
    if (e) return {session:s, ex:e};
  }
  return null;
}
function suggest(item){
  const [id,sets,lo,hi,start] = item; const def = EX[id];
  const h = lastFor(id);
  if (!h) return {kg:start, why: start!=null ? "Starting load from the plan" : (def.mode==="time"||def.mode==="reps") ? "" : def.unit==="kg added" ? "Bodyweight to start. Stop 2–3 reps short of failure" : "Pick a weight you could lift for 2–3 more reps", kind:""};
  const work = h.ex.sets.filter(s=>s.done && num(s.reps)!=null);
  const kgs = work.map(s=>num(s.kg)).filter(v=>v!=null);
  const top = kgs.length ? Math.max(...kgs) : null;
  const chk = h.session.check ? h.session.check.status : null;
  const target = h.ex.hi ?? hi;
  const allTop = work.length >= Math.min(h.ex.plannedSets||sets, sets) && work.every(s=>num(s.reps) >= target);
  const inc = def.inc || 0;
  if (chk === "worse") return {kg: top!=null && inc ? Math.max(0, top - inc) : top, why:"Last 48-hour check was worse: one step back on load", kind:"down"};
  if (h.session.light === "amber") return {kg: top, why:"Last time was an Amber session: repeat it before progressing", kind:""};
  if (allTop && chk === "same"){
    if (top!=null && inc) return {kg: top+inc, why:`Top of the range on every set and a clean 48-hour check: add ${inc}kg`, kind:"up"};
    return {kg: top, why:"Top of the range and a clean 48-hour check: add a little difficulty", kind:"up"};
  }
  if (allTop && chk === "settling") return {kg: top, why:"Top of the range, but the 48-hour check was settling: hold this weight", kind:""};
  if (allTop) return {kg: top, why:"Top of the range hit. Add weight once that session's 48-hour check is clean", kind:""};

}
function lastLine(id){
  const h = lastFor(id); if (!h) return "";

  const kgs = [...new Set(sets.map(s=>fmtKg(num(s.kg))).filter(Boolean))];
  const reps = sets.map(s=>s.reps||"–").join(", ");
  const unit = d.mode==="time" ? "s" : d.mode==="dist" ? "m" : "";
  return `Last (${fmtDate(h.session.date)}): ${kgs.length? kgs.join("/")+"kg × ":""}${reps}${unit}`;
}
function targetText(item){
  const [id,sets,lo,hi,,opts] = item; const d = EX[id];
  const r = lo===hi ? `${lo}` : `${lo}–${hi}`;
  const unit = d.mode==="time" ? "s" : d.mode==="dist" ? "m" : "";

function sessionItems(phase, key, light){
  const P = PHASES[phase], S = P.sessions[key], wk = weekNo();
  const out = [];
  for (const it of S.items){
    const opts = it[5] || {};
    if (opts.optional && !(wk >= (opts.fromWeek||1) && state.optional[it[0]])) continue;
    let item = it.slice();
    if (light === "amber"){
      const a = EX[it[0]].amber;
      if (a === "skip") continue;
      if (a && a.to){ if (S.items.some(x=>x[0]===a.to) || out.some(x=>x[0]===a.to)) continue; item = [a.to, it[1], EX[a.to]===EX.goblet?8:it[2], EX[a.to]===EX.goblet?10:it[3], (Object.values(P.sessions).flatMap(x=>x.items).find(x=>x[0]===a.to)||[])[4] ?? null, {}]; }

const setTxt = (e, x) => { const d = EX[e.id] || {}; const unit = d.mode==="time" ? "s" : d.mode==="dist" ? "m" : ""; const kg = x.kg!==""&&x.kg!=null ? fmtKg(num(x.kg))+"kg × " : ""; return `${kg}${x.reps||"–"}${unit}`; };
function weekNoFor(dd){ const s = new Date(state.settings.startDate+"T00:00:00"); return Math.floor((new Date(dd+"T00:00:00") - s)/(7*DAY)) + 1; }
function walkRange(wk, type){
  const base = state.settings.phase>1 ? [45,60] : wk<=2 ? [20,30] : [Math.min(45,20+5*(wk-2)), Math.min(60,30+5*(wk-2))];
  return type==="long" ? [base[1], base[1]+15] : base;
}
const r5 = x => Math.max(10, Math.round(x/5)*5);
function walkForLight(wk, type, light){
  if (light==="red") return "Only if comfortable: 10–15 min, flat. Otherwise rest.";
  if (type==="rest") return light==="amber" ? "Optional, short and easy" : "Optional, easy pace";
  const [lo,hi] = walkRange(wk, type);
  if (light==="amber") return `${r5(lo*0.6)}–${r5(hi*0.6)} min, flat and easy`;
  return `${lo}–${hi} min${type==="long"&&state.settings.phase>1?", ruck on a good day":""}`;

const TYPE_LABEL = {lift:"Lifting day", walk:"Walk day", long:"Long walk day", rest:"Rest day", moved:"Walk day"};
function earlySkip(){
  const P = PHASES[state.settings.phase];
  const ds = doneSessions().filter(s=>s.phase===state.settings.phase).sort((a,b)=>b.startedAt-a.startedAt);
  if (!ds.length) return null;
  const L = ds[0].date; const typeOf = d => P.week[new Date(d+"T12:00:00").getDay()];
  if (typeOf(L)==="lift") return null;
  let prevLift = null; for (let k=1;k<8;k++){ const d = iso(new Date(L+"T12:00:00").getTime()-k*DAY); if (typeOf(d)==="lift"){ prevLift = d; break; } }
  const prevSess = ds.find(x=>x.date<L);
  const covered = !prevLift || prevLift < state.settings.startDate || (prevSess && prevSess.date >= prevLift);
  if (!covered) return null; // a make-up for a missed day, so nothing ahead moves
  for (let k=1;k<=3;k++){ const d = iso(new Date(L+"T12:00:00").getTime()+k*DAY); if (typeOf(d)==="lift") return {date:d, from:L, title:ds[0].title}; }
  return null;
}
// What the plan has for a date from today onwards. Lifting days take the next sessions in order, so a missed or moved session just shifts the rest along.
function plannedFor(dd){
  const t = todayIso(); if (dd < t) return null;
  const P = PHASES[state.settings.phase]; const order = P.order;
  const trainedToday = doneSessions().some(s=>s.date===t) || !!currentSession();
  let i = order.indexOf(nextKey()); if (i<0) i = 0;
  const skip = earlySkip();
  for (let ms = new Date(t+"T12:00:00").getTime(); ; ms += DAY){
    const d = iso(ms); const type = P.week[new Date(ms).getDay()];
    if (skip && d===skip.date && type==="lift" && !(d===t && trainedToday)){ if (d===dd) return {type:"moved", from:skip.from, title:skip.title}; continue; }
    const counts = type==="lift" && !(d===t && trainedToday);
    if (d === dd){ return counts ? {type:"lift", key:order[i % order.length], session:P.sessions[order[i % order.length]]} : {type: (d===t && trainedToday) ? "done" : type}; }
    if (counts) i++;
  }
}

function weightChart(list){
  const DAYMS = DAY, t0 = new Date(list[0].date+"T12:00:00").getTime();
  const lastMs = Math.max(new Date(list[list.length-1].date+"T12:00:00").getTime(), Date.now());
  const nextGoal = BW_GOALS.find(g => new Date(g.date+"T12:00:00").getTime() > lastMs);
  const t1 = Math.max(lastMs + 21*DAYMS, nextGoal ? new Date(nextGoal.date+"T12:00:00").getTime() + 7*DAYMS : 0, t0 + 42*DAYMS);
  const goals = BW_GOALS.filter(g => { const m = new Date(g.date+"T12:00:00").getTime(); return m >= t0 && m <= t1; });
  const months = (t1 - t0)/(30.44*DAYMS), k0 = list[0].kg;
  const vals = list.map(w=>w.kg).concat(goals.map(g=>g.kg), [k0 + months*1, k0]);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const W=640,H=240,L=46,Rr=16,T=16,B=30;
  const x = ms => L + (ms - t0)/(t1 - t0)*(W-L-Rr), y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  let g = "";
  const step = (hi-lo) > 10 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) g += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
  const band = `M${x(t0)},${y(k0+0)} L${x(t1)},${y(k0+months*1)} L${x(t1)},${y(k0+months*0.5)} Z`;
  const pts = list.map(w=>({ms:new Date(w.date+"T12:00:00").getTime(), v:w.kg}));
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(p.ms)},${y(p.v)}`).join(" ");
  const gm = goals.map(gl=>{ const gx = x(new Date(gl.date+"T12:00:00").getTime()), gy = y(gl.kg); return `<line x1="${gx}" x2="${gx}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="3 4"/><path d="M${gx-6},${gy} L${gx},${gy-6} L${gx+6},${gy} L${gx},${gy+6} Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="${gx-9}" y="${gy-9}" text-anchor="end" font-size="12" fill="var(--ink)">${gl.label} · ${gl.kg}kg</text>`; }).join("");
  const xl = [t0, t1].map((m,i)=>`<text x="${x(m)}" y="${H-8}" text-anchor="${i?"end":"start"}" font-size="12" fill="var(--muted)">${fmtDate(iso(m))}</text>`).join("");
  const lp = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight over time against target pace">${g}<path d="${band}" fill="var(--green-soft)" stroke="none"/>${gm}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${x(p.ms)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}<text x="${x(lp.ms)+8}" y="${y(lp.v)+4}" font-size="13" font-weight="600" fill="var(--ink)">${(+lp.v).toFixed(1)}</text>${xl}</svg>
    <div class="legend"><span><span class="dot" style="color:var(--accent)"></span> Your weight (kg)</span><span><span class="swatch"></span> Target pace, +0.5 to +1kg a month</span>${goals.length?`<span>◇ Programme goal</span>`:""}</div>`;
}

function chart(dates, vals, label){
  const pts = vals.map((v,i)=>({v,i,d:dates[i]})).filter(p=>p.v!=null);
  if (pts.length < 2) return `<p class="small muted">The chart appears after two sessions with this lift.</p>`;
  const W=640,H=220,L=44,R=16,T=14,B=30;
  let lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
  if (lo===hi){ lo -= 5; hi += 5; } const pad=(hi-lo)*.12; lo=Math.max(0,lo-pad); hi=hi+pad;
  const x = i => L + (pts.length===1?0:(i/(pts.length-1))*(W-L-R));
  const y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks = 4; let grid="";
  for (let k=0;k<=ticks;k++){ const v = lo + (hi-lo)*k/ticks; grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(v*10)/10}</text>`; }
  const line = pts.map((p,k)=>`${k?"L":"M"}${x(k)},${y(p.v)}`).join(" ");
  const area = `${line} L${x(pts.length-1)},${H-B} L${x(0)},${H-B} Z`;
  const lastP = pts[pts.length-1];
  const labs = [0, pts.length-1].map(k=>`<text x="${x(k)}" y="${H-8}" text-anchor="${k?"end":"start"}" font-size="12" fill="var(--muted)">${fmtDate(pts[k].d)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} over time">${grid}<path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${pts.map((p,k)=>`<circle cx="${x(k)}" cy="${y(p.v)}" r="${k===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}<text x="${x(pts.length-1)-8}" y="${y(lastP.v)-10}" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">${fmtKg(lastP.v)}</text>${labs}</svg><p class="small muted">${esc(label)}</p>`;
}

function makeEntry(it){ const [id,sets,lo,hi] = it; const sg = suggest(it); return { id, lo, hi, ss:(it[5]&&it[5].ss)||null, plannedSets:sets, target:targetText(it), last:lastLine(id), why:sg.why, kind:sg.kind,

  const order = [state.settings.phase, 1, 2, 3];

function startSession(){

    exercises: items.map(makeEntry) };

function finish(early){

  else if (a==="ed-light"){ state.editing.draft.light = v; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if (a==="ed-check"){ state.editing.draft.check = v ? {status:v, at:Date.now()} : null; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if (a==="ed-tick"){ const row=b.closest(".set"); const st=state.editing.draft.exercises[row.dataset.e].sets[row.dataset.s]; st.done=!st.done; row.classList.toggle("done",st.done); b.setAttribute("aria-pressed",st.done); }
  else if (a==="ed-addset"||a==="ed-delset"){ const ex=state.editing.draft.exercises[b.dataset.e]; if(a==="ed-addset"){ const l=ex.sets[ex.sets.length-1]; ex.sets.push({kg:l?l.kg:"",reps:"",ph:l?l.ph:"",done:true}); } else ex.sets.pop(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if (a==="del"){ const el = document.getElementById("del-"+b.dataset.id); if (el) el.hidden = false; }
  else if (a==="del-yes") removeSession(b.dataset.id);
  else if (a==="theme"){ saveSettings({theme:v}); applyTheme(); render(); }
  else if (a==="phase"){ saveSettings({phase:Number(v)}); state.pick=null; render(); }
});
document.addEventListener("input", e=>{
  const el = e.target;
  if (el.id==="pick-q"){ const q = el.value.trim().toLowerCase(); document.querySelectorAll(".pick").forEach(b=>{ b.hidden = q && !b.dataset.name.includes(q); }); document.querySelectorAll(".pgroup").forEach(g=>{ g.hidden = ![...g.querySelectorAll(".pick")].some(b=>!b.hidden); }); return; }
  if (el.id==="w-kg"){ const n = num(el.value); const lb = document.getElementById("w-lb"); if (lb) lb.textContent = n ? toLb(n)+" lb" : ""; return; }
  if (el.dataset.f){ const row = el.closest(".set"); const s = currentSession(); if (!s) return; s.exercises[row.dataset.e].sets[row.dataset.s][el.dataset.f] = el.value; saveSessionSoon(s); }
  else if (el.dataset.ed && state.editing){ const row = el.closest(".set"); state.editing.draft.exercises[row.dataset.e].sets[row.dataset.s][el.dataset.ed] = el.value; }
  else if (el.id==="ed-notes" && state.editing){ state.editing.draft.notes = el.value; }
  else if (el.id==="notes"){ const s = currentSession(); if (s){ s.notes = el.value; saveSessionSoon(s); } }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.id==="w-kg"){ const n = num(el.value); const lb = document.getElementById("w-lb"); if (lb) lb.textContent = n ? toLb(n)+" lb" : ""; }
  if (el.id==="day-walk"){ const n = num(el.value); saveDay(state.selDay||todayIso(),{walkMin: n==null?null:n}); }
  else if (el.id==="walk"){ const n = num(el.value); saveDay(todayIso(),{walkMin: n==null?null:n}); }
  else if (el.id==="start" && el.value){ saveSettings({startDate:el.value}); render(); }
});

function partnerOf(s, ei){ const e = s.exercises[ei]; if (!e || !e.ss || e.removed) return -1; return s.exercises.findIndex((x,j)=>j!==ei && x.ss===e.ss && !x.removed); }
function nextLive(s, from){ for (let j=from; j<s.exercises.length; j++) if (!s.exercises[j].removed) return s.exercises[j]; return null; }
function nextAfter(s, ei){ const pi = partnerOf(s, ei); const last = Math.max(ei, pi); return nextLive(s, last+1); }
function afterSet(s, ei, si){
  const ex = s.exercises[ei], pi = partnerOf(s, ei);
  if (pi > -1){
    const pe = s.exercises[pi], first = ei < pi;
    const pending = pe.sets.findIndex(x=>!x.done);
    if (first && pending > -1){
      startRest(0, `Go: ${EX[pe.id].name}, set ${pending+1}`, true);
      const el = document.querySelector(`.set[data-e="${pi}"][data-s="${pending}"]`); el?.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    const fe = first ? ex : pe; const fi = first ? ei : pi;
    const nf = fe.sets.findIndex(x=>!x.done);
    const rest = Math.max(EX[ex.id].rest||60, EX[pe.id].rest||60);
    if (nf > -1){ startRest(rest, `Next: ${EX[fe.id].name}, set ${nf+1}`); const el = document.querySelector(`.set[data-e="${fi}"][data-s="${nf}"]`); el?.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    const pend2 = ex.sets.findIndex(x=>!x.done);
    if (pend2 > -1){ startRest(rest, `Next: ${EX[ex.id].name}, set ${pend2+1}`); return; }
    const nx = nextAfter(s, ei); startRest(rest, nx ? "Next: "+EX[nx.id].name : "Last set done. Finish when ready."); return;
  }
  const allDone = ex.sets.every(x=>x.done); const nxt = allDone ? nextLive(s, ei+1) : ex;
  startRest(EX[ex.id].rest||90, nxt ? (allDone ? "Next: "+EX[nxt.id].name : EX[ex.id].name+", set "+(ex.sets.findIndex(x=>!x.done)+1)) : "Last set done. Finish when ready.");
}
document.addEventListener("submit", e=>{
  if (e.target.id !== "wform") return; e.preventDefault();
  const dt = $("#w-date").value || todayIso(); const kg = num($("#w-kg").value);
  if (kg==null || kg < 30 || kg > 200){ toast("Enter your weight in kg, like 75.7"); return; }
  const fasted = $("#w-fasted").getAttribute("aria-pressed")==="true";
  if (state.wEdit && state.wEdit.date !== dt) delete state.weights[state.wEdit.date];
  saveWeight(dt, Math.round(kg*10)/10, fasted); state.wEdit = null; render();
  toast(`Saved ${Math.round(kg*10)/10}kg (${toLb(kg)} lb).`);
});
/* ---------- Rest timer + screen awake ---------- */
let restEnd = 0, restInt = null;
function startRest(sec,label,go){ restEnd = Date.now()+sec*1000; $("#rest-label").textContent = label; $("#rest").hidden = false; $("#rest").classList.remove("over"); $("#rest .eyebrow").textContent = go ? "Superset" : "Rest"; clearInterval(restInt); tickRest(); restInt = setInterval(tickRest, 250); }
function tickRest(){ const left = Math.round((restEnd-Date.now())/1000); const a = Math.abs(left); $("#rest-t").textContent = (left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0"); $("#rest").classList.toggle("over", left<=0); }
function stopRest(){ clearInterval(restInt); $("#rest").hidden = true; }
$("#rest-add").addEventListener("click", ()=>{ restEnd += 30000; tickRest(); });
$("#rest-skip").addEventListener("click", stopRest);
let lock = null;
async function wake(){ try { lock = await navigator.wakeLock?.request("screen"); } catch { lock = null; } }
function release(){ try { lock?.release(); } catch {} lock = null; }
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && currentSession()) wake(); });

/* ---------- Backup: export and restore ---------- */
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text],{type}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportJson(){
  const sessions = {}; state.sessions.forEach(s=>sessions[s.id]=s);
  download(`rebuild-log-backup-${todayIso()}.json`, JSON.stringify({app:"rebuild-log",version:1,exportedAt:new Date().toISOString(),sessions,days:state.days,weights:state.weights,settings:state.settings},null,1), "application/json");
  saveSettings({lastBackup:todayIso()}); render();
}
function exportCsv(){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [["date","session","phase","week","light","check_48h","exercise","set","kg","reps","done","ended_early","notes","session_id","exercise_id","started_at","finished_at"]];
  doneSessions().sort((a,b)=>a.startedAt-b.startedAt).forEach(s=>s.exercises.forEach(e=>e.sets.forEach((st,i)=>rows.push([s.date,s.title,s.phase,s.week,s.light,s.check?.status||"",EX[e.id]?.name||e.id,i+1,st.kg,st.reps,st.done?"yes":"no",s.endedEarly||"",i===0&&e===s.exercises[0]?s.notes:"",s.id,e.id,s.startedAt,s.finishedAt||""]))));
  const days = [["date","light","walk_min","routine_items_done","weight_kg","weight_lb","weight_morning_fasted"]];
  [...new Set([...Object.keys(state.days), ...Object.keys(state.weights)])].sort().forEach(dt=>{ const d = state.days[dt]||{}; const w = state.weights[dt];
    days.push([dt,d.light||"",d.walkMin??"",(d.routine||[]).filter(Boolean).length, w?w.kg:"", w?toLb(w.kg):"", w?(w.fasted?"yes":"no"):""]); });
  download(`rebuild-log-sets-${todayIso()}.csv`, rows.map(r=>r.map(q).join(",")).join("\n"), "text/csv");
  setTimeout(()=>download(`rebuild-log-days-${todayIso()}.csv`, days.map(r=>r.map(q).join(",")).join("\n"), "text/csv"), 600);
}
function parseCsv(text){
  text = text.replace(/^﻿/,"");
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if (f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==""));
}
function mergeSession(imp, tally){
  const i = state.sessions.findIndex(x=>x.id===imp.id || (x.date===imp.date && x.title===imp.title && x.status==="done"));
  if (i>-1){ imp.id = state.sessions[i].id; state.sessions[i] = imp; tally.updated++; } else { state.sessions.push(imp); tally.added++; }
}
function mergeDay(d, patch){ state.days[d] = {...(state.days[d]||{}), ...patch, date:d}; }
function importCsvText(text, tally){
  const rows = parseCsv(text); if (rows.length<2) return;
  const H = rows[0].map(x=>x.trim().toLowerCase()); const col = n => H.indexOf(n);
  const get = (r,n) => { const k=col(n); return k>-1 ? (r[k]??"").trim() : ""; };
  if (col("walk_min")>-1){
    rows.slice(1).forEach(r=>{ const d=get(r,"date"); if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return; const p={};
      if (get(r,"light")) p.light=get(r,"light"); const w=num(get(r,"walk_min")); if (w!=null) p.walkMin=w;
      const n=num(get(r,"routine_items_done")); if (n!=null) p.routine=ROUTINE.map((_,i)=>i<n);
      if (p.light || p.walkMin!=null || (n!=null && n>0)){ mergeDay(d,p); tally.days++; }
      const wk=num(get(r,"weight_kg")); if (wk!=null){ state.weights[d] = {date:d, kg:wk, fasted: !/^(no|false|0)$/i.test(get(r,"weight_morning_fasted"))}; tally.weights++; } });
    return;
  }
  if (col("exercise")<0 || col("date")<0) throw new Error("bad");
  const byName = {}; Object.entries(EX).forEach(([k,v])=>byName[v.name.toLowerCase()]=k);
  const groups = new Map();
  rows.slice(1).forEach((r,ri)=>{ const d=get(r,"date"); if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const key = get(r,"session_id") || d+"|"+get(r,"session");
    if (!groups.has(key)) groups.set(key,{rows:[],order:ri}); groups.get(key).rows.push(r); });
  for (const [key,g] of groups){
    const r0 = g.rows[0]; const phase = num(get(r0,"phase")) || 1; const title = get(r0,"session");
    const P = PHASES[phase] || PHASES[1]; const k = Object.keys(P.sessions).find(x=>P.sessions[x].title===title) || null;
    const S = k ? P.sessions[k] : null; const date = get(r0,"date");
    const started = num(get(r0,"started_at")) || (new Date(date+"T12:00:00").getTime() + g.order);
    const chk = get(r0,"check_48h");
    const sess = { id: get(r0,"session_id") || date+"-"+uid(), phase, key:k, title, sub: S?S.sub:"", date, week: num(get(r0,"week"))||1,
      light: get(r0,"light")||"green", status:"done", startedAt: started, finishedAt: num(get(r0,"finished_at")) || started,
      notes: g.rows.map(r=>get(r,"notes")).filter(Boolean).join(" "), endedEarly: get(r0,"ended_early")||null,
      check: CHECKS[chk] ? {status:chk, at:started} : null, exercises: [] };
    const exMap = new Map();
    g.rows.forEach(r=>{ const id = get(r,"exercise_id") || byName[get(r,"exercise").toLowerCase()] || get(r,"exercise");
      if (!exMap.has(id)){ const it = S ? S.items.find(x=>x[0]===id) : null;
        exMap.set(id,{ id, lo: it?it[2]:null, hi: it?it[3]:null, ss: it&&it[5]&&it[5].ss || null, plannedSets: it?it[1]:null, target: it?targetText(it):"", sets:[] }); }
      exMap.get(id).sets.push({ kg:get(r,"kg"), reps:get(r,"reps"), ph:"", done: /^(yes|true|1)$/i.test(get(r,"done")) }); });
    sess.exercises = [...exMap.values()];
    mergeSession(sess, tally);
  }
}
async function importFiles(files){
  const tally = {added:0, updated:0, days:0, weights:0};
  try {
    for (const file of files){
      const text = await file.text();
      if (/^\s*\{/.test(text)){
        const data = JSON.parse(text);
        if (data.app !== "rebuild-log" || !data.sessions) throw new Error("bad");
        const hadNone = !state.sessions.length;
        Object.values(data.sessions).forEach(x=>mergeSession(x, tally));
        Object.entries(data.days||{}).forEach(([d,v])=>{ mergeDay(d,v); tally.days++; });
        Object.values(data.weights||{}).forEach(w=>{ if (w && w.date && num(w.kg)!=null){ state.weights[w.date] = {date:w.date, kg:num(w.kg), fasted:w.fasted!==false}; tally.weights++; } });
        if (hadNone && data.settings) state.settings = {...state.settings, ...data.settings};
        state.settings.lastBackup = (data.exportedAt||"").slice(0,10) || state.settings.lastBackup;
      } else importCsvText(text, tally);
    }
    state.sessions.sort((a,b)=>b.startedAt-a.startedAt);
    lsSave(); render();
    toast(`Imported: ${tally.added} new session${tally.added===1?"":"s"}, ${tally.updated} updated${tally.days?`, ${tally.days} days`:""}${tally.weights?`, ${tally.weights} weights`:""}.`);
  } catch { lsSave(); render(); toast("That file isn't a Rebuild Log backup or CSV export."); }
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-x]"); if (!b) return;
  if (b.dataset.x==="json") exportJson();
  else if (b.dataset.x==="csv") exportCsv();
  else if (b.dataset.x==="restore") $("#restore-file").click();
});
document.addEventListener("change", e=>{ if (e.target.id==="restore-file" && e.target.files.length){ importFiles([...e.target.files]); e.target.value=""; } });
try { navigator.storage?.persist?.(); } catch {}
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(()=>{}); }

boot();
</script>
